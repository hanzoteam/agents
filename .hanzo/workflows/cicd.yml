# ~7-line canonical caller — all real config lives in /hanzo.yml, which
# platform.hanzo.ai reads too. The pipeline itself lives in hanzoai/ci and only
# there; naming a forwarder makes git.hanzo.ai take a second hop it cannot take.
#
# master, not main: this forks a master-based upstream, and renaming the branch
# would only make every comparison with upstream need a translation.
name: CI/CD
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  cicd:
    # Pinned to a COMMIT, not @v1. v1 is a moving tag and the runners cache a
    # reusable workflow by ref, so a build's behaviour depended on whether the
    # runner it landed on had fetched v1 before or after it last moved — the
    # same commit built green on one runner and failed on another, because one
    # of them was replaying a copy of v1 from before the package credential
    # existed. A commit cannot move, so a cache of it cannot be stale.
    uses: hanzoai/ci/.hanzo/workflows/build.yml@8a512481bec026ffad9289e96a246240de072df5
    secrets: inherit
